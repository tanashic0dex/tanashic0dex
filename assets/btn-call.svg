<svg xmlns="http://www.w3.org/2000/svg" width="146" height="44" viewBox="0 0 146 44" fill="none" role="img" aria-label="Book a call">
<title>Book a call</title>
<style>
  .sans{font-family:'Inter','Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace}
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.4s .4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{animation:fadein 1.6s .9s ease both} @keyframes fadein{from{opacity:0}to{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .bob{animation:bob 6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7B68EE"/></linearGradient></defs>
<rect x=".5" y=".5" width="145" height="43" rx="22" fill="#0E0D16" stroke="#2E2A45"/>
<rect x="20" y="16" width="16" height="12" rx="2.5" stroke="#A78BFA" stroke-width="1.6"/><path d="M21 18 l7 5 7-5" stroke="#A78BFA" stroke-width="1.6" stroke-linejoin="round"/>
<text x="46" y="27" class="sans" font-size="14" font-weight="700" fill="#C9C5E3" text-anchor="start" >Book a call</text>
</svg>