  <linearGradient id="gLogo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".5" stop-color="#7B68EE"/><stop offset="1" stop-color="#4C3BCF"/></linearGradient>
  <linearGradient id="gBorder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".9"/><stop offset=".45" stop-color="#2E2A45"/><stop offset="1" stop-color="#221F33" stop-opacity="0"/></linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B68EE" stop-opacity=".45"/><stop offset="1" stop-color="#7B68EE" stop-opacity="0"/></linearGradient>
  <linearGradient id="gLine" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset=".6" stop-color="#7B68EE"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
