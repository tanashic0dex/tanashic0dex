<text x="24" y="76" font-size="22" font-weight="600" letter-spacing="-.4">ArmPay</text>
<text x="24" y="104" font-size="14" fill="#59636e" style="fill:#59636e">Multi-tenant PIX payments — billing, invoices and</text>
<text x="24" y="124" font-size="14" style="fill:#59636e">recurring charges, one isolated database per tenant.</text>
