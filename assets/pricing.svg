<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" fill="none" role="img" aria-label="Pricing">
<title>Pricing</title>
<style>
  .sans{font-family:'Inter','Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace}
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.4s .4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{animation:fadein 1.6s .9s ease both} @keyframes fadein{from{opacity:0}to{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .bob{animation:bob 6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gHi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".5" stop-color="#7B68EE"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="gBtn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7B68EE"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  <radialGradient id="glowBg" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#7B68EE" stop-opacity=".16"/><stop offset="1" stop-color="#7B68EE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="640" rx="24" fill="#07060D"/>
<rect width="1000" height="640" rx="24" fill="url(#glowBg)"/>
<rect x=".5" y=".5" width="999" height="639" rx="24" stroke="#fff" stroke-opacity=".08"/>

  <text x="500" y="56" class="sans" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="2.4" >PRICING</text>
  <text x="500" y="102" class="sans" font-size="38" font-weight="800" fill="#F4F2FF" text-anchor="middle" letter-spacing="-1.2" >Simple, transparent plans.</text>
  <text x="500" y="134" class="sans" font-size="16" font-weight="400" fill="#9591B3" text-anchor="middle" >Every plan includes clean code, clear communication and zero ghosting.</text>

    
    <rect x="32" y="180" width="300" height="416" rx="18" fill="#0E0D16" stroke="#221F33" stroke-width="1"/>
    <rect x="50" y="180" width="264" height="1" fill="url(#hl)"/>
    
    <text x="60" y="220" class="sans" font-size="16" font-weight="700" fill="#C9C5E3" text-anchor="start" >Open Source</text>
    <text x="60" y="278" class="sans" font-size="42" font-weight="800" fill="#F4F2FF" text-anchor="start" letter-spacing="-1.5" >$0</text>
    <text x="115.3" y="278" class="sans" font-size="13.5" font-weight="400" fill="#5F5B7A" text-anchor="start" >/forever</text>
    <text x="60" y="310" class="sans" font-size="14" font-weight="400" fill="#9591B3" text-anchor="start" >Explore, fork and learn from my code.</text>
    <rect x="60" y="340" width="244" height="1" fill="#fff" fill-opacity=".07"/>
    <circle cx="68" cy="376" r="9" fill="#9591B3" fill-opacity=".14"/><path d="M64 376 l2.8 2.8 L72.2 372.8" stroke="#9591B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="381" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Star &amp; fork any repo</text><circle cx="68" cy="408" r="9" fill="#9591B3" fill-opacity=".14"/><path d="M64 408 l2.8 2.8 L72.2 404.8" stroke="#9591B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="413" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Issues and PRs welcome</text><circle cx="68" cy="440" r="9" fill="#9591B3" fill-opacity=".14"/><path d="M64 440 l2.8 2.8 L72.2 436.8" stroke="#9591B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="445" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Clean, documented code</text>
    <rect x="60" y="526" width="244" height="44" rx="12" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity=".12"/>
    <text x="182" y="553.5" class="sans" font-size="14" font-weight="700" fill="#C9C5E3" text-anchor="middle" xml:space="preserve">Browse repos  →</text>
    <rect x="349" y="179" width="302" height="418" rx="19" fill="url(#gHi)" filter="url(#glow)" opacity=".55"/>
    <rect x="350" y="180" width="300" height="416" rx="18" fill="#120F22" stroke="url(#gHi)" stroke-width="1.5"/>
    <rect x="368" y="180" width="264" height="1" fill="url(#hl)"/>
    <rect x="518" y="202" width="110" height="24" rx="12" fill="#7B68EE"/><text x="573" y="218.5" class="sans" font-size="10" font-weight="800" fill="#F4F2FF" text-anchor="middle" letter-spacing="1" >MOST POPULAR</text>
    <text x="378" y="220" class="sans" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="start" >Freelance</text>
    <text x="378" y="278" class="sans" font-size="34" font-weight="800" fill="#F4F2FF" text-anchor="start" letter-spacing="-1.5" >Let's talk</text>
    <text x="531.4" y="278" class="sans" font-size="13.5" font-weight="400" fill="#5F5B7A" text-anchor="start" >/project</text>
    <text x="378" y="310" class="sans" font-size="14" font-weight="400" fill="#9591B3" text-anchor="start" >Your idea, shipped end-to-end.</text>
    <rect x="378" y="340" width="244" height="1" fill="#fff" fill-opacity=".07"/>
    <circle cx="386" cy="376" r="9" fill="#A78BFA" fill-opacity=".14"/><path d="M382 376 l2.8 2.8 L390.2 372.8" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="381" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Landing pages &amp; web apps</text><circle cx="386" cy="408" r="9" fill="#A78BFA" fill-opacity=".14"/><path d="M382 408 l2.8 2.8 L390.2 404.8" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="413" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >React + TypeScript frontends</text><circle cx="386" cy="440" r="9" fill="#A78BFA" fill-opacity=".14"/><path d="M382 440 l2.8 2.8 L390.2 436.8" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="445" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >REST APIs with Node.js</text><circle cx="386" cy="472" r="9" fill="#A78BFA" fill-opacity=".14"/><path d="M382 472 l2.8 2.8 L390.2 468.8" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="477" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Deploy &amp; handoff included</text>
    <rect x="378" y="526" width="244" height="44" rx="12" fill="url(#gBtn)" fill-opacity="1" stroke="none" stroke-opacity=".12"/>
    <text x="500" y="553.5" class="sans" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">Start a project  →</text>
    
    <rect x="668" y="180" width="300" height="416" rx="18" fill="#0E0D16" stroke="#221F33" stroke-width="1"/>
    <rect x="686" y="180" width="264" height="1" fill="url(#hl)"/>
    
    <text x="696" y="220" class="sans" font-size="16" font-weight="700" fill="#C9C5E3" text-anchor="start" >Full-time</text>
    <text x="696" y="278" class="sans" font-size="34" font-weight="800" fill="#F4F2FF" text-anchor="start" letter-spacing="-1.5" >Hire me</text>
    <text x="822.3" y="278" class="sans" font-size="13.5" font-weight="400" fill="#5F5B7A" text-anchor="start" >/remote or hybrid</text>
    <text x="696" y="310" class="sans" font-size="14" font-weight="400" fill="#9591B3" text-anchor="start" >A dev who shows up and ships.</text>
