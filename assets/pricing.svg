    <circle cx="704" cy="376" r="9" fill="#9591B3" fill-opacity=".14"/><path d="M700 376 l2.8 2.8 L708.2 372.8" stroke="#9591B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="722" y="381" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Junior full-stack role</text><circle cx="704" cy="408" r="9" fill="#9591B3" fill-opacity=".14"/><path d="M700 408 l2.8 2.8 L708.2 404.8" stroke="#9591B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="722" y="413" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >React / Node / PHP</text><circle cx="704" cy="440" r="9" fill="#9591B3" fill-opacity=".14"/><path d="M700 440 l2.8 2.8 L708.2 436.8" stroke="#9591B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="722" y="445" class="sans" font-size="14" font-weight="400" fill="#C9C5E3" text-anchor="start" >Available right now</text>
    <rect x="696" y="526" width="244" height="44" rx="12" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity=".12"/>
