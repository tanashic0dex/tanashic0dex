<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" fill="none" role="img" aria-label="Features">
<title>Features</title>
<style>
  .sans{font-family:'Inter','Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace}
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.4s .4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{animation:fadein 1.6s .9s ease both} @keyframes fadein{from{opacity:0}to{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .bob{animation:bob 6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .trk{animation:trk 4s ease-in-out infinite} @keyframes trk{0%,35%{fill:#2A2740}45%,85%{fill:#7B68EE}95%,100%{fill:#2A2740}}
  .knob{animation:knob 4s ease-in-out infinite} @keyframes knob{0%,35%{transform:none}45%,85%{transform:translateX(18px)}95%,100%{transform:none}}
  .cursor{animation:cur 4s ease-in-out infinite} @keyframes cur{0%{transform:translate(40px,60px);opacity:0}15%{opacity:1}30%,40%{transform:none}33%{transform:scale(.92)}60%{transform:translate(-30px,40px);opacity:1}80%,100%{transform:translate(40px,60px);opacity:0}}
  .prog{transform-box:fill-box;animation:prog 4s ease-in-out infinite} @keyframes prog{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
  .ring{animation:ring 2s .3s cubic-bezier(.3,.7,.2,1) both} @keyframes ring{from{stroke-dashoffset:326.7}}
  .grow{transform-box:fill-box;animation:grow 1.6s cubic-bezier(.3,.7,.2,1) both} @keyframes grow{from{transform:scaleX(0)}}
  .resp{animation:resp 4s ease infinite} @keyframes resp{0%,25%{opacity:0}35%,90%{opacity:1}100%{opacity:0}}</style>

<defs>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gAv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#7B68EE"/></linearGradient>
  <linearGradient id="gBar" x1="0" x2="1"><stop offset="0" stop-color="#7B68EE"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <radialGradient id="glowBg" cx=".5" cy="0" r=".7"><stop offset="0" stop-color="#7B68EE" stop-opacity=".22"/><stop offset="1" stop-color="#7B68EE" stop-opacity="0"/></radialGradient>
</defs>
