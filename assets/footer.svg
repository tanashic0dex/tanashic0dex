<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none" role="img" aria-label="Footer">
<title>Footer</title>
<style>
  .sans{font-family:'Inter','Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace}
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.4s .4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{animation:fadein 1.6s .9s ease both} @keyframes fadein{from{opacity:0}to{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .bob{animation:bob 6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <linearGradient id="gWord" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#A78BFA" stop-opacity=".45"/><stop offset="1" stop-color="#7B68EE" stop-opacity="0"/></linearGradient>
  <radialGradient id="glowBg" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#7B68EE" stop-opacity=".3"/><stop offset="1" stop-color="#7B68EE" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1000" height="280" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="280" fill="#07060D"/>
  <rect width="1000" height="280" fill="url(#glowBg)"/>
  <text x="500" y="62" class="sans" font-size="22" font-weight="700" fill="#F4F2FF" text-anchor="middle" letter-spacing="-0.5" >Built in Brazil. Shipped everywhere.</text>
  <text x="500" y="90" class="sans" font-size="12.5" font-weight="400" fill="#5F5B7A" text-anchor="middle" >© 2026 Watanashi · this README is generated by code (scripts/build.mjs) · last build Sep 30, 2026</text>
  <text x="500" y="302" class="sans" font-size="150" font-weight="900" letter-spacing="-7" text-anchor="middle" fill="url(#gWord)">tanashic0dex</text>
</g>
<rect x=".5" y=".5" width="999" height="279" rx="24" stroke="#fff" stroke-opacity=".08"/>
</svg>