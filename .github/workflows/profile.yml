# Rebuilds the profile (SVGs + README) from real GitHub data.
# Runs every day, on manual trigger, and whenever the config or the script changes.
name: Build profile

on:
  schedule:
    - cron: "17 6 * * *" # daily, 03:17 in São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render profile
        run: node scripts/build.mjs
        env:
          # METRICS_TOKEN (optional) also counts private contributions
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(profile): daily rebuild"
          git push
